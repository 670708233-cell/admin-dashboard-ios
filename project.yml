name: AdminDashboard
options:
  bundleIdPrefix: com.doushujun
  deploymentTarget:
    iOS: "16.0"
targets:
  AdminDashboard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AdminDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doushujun.admin
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: AdminDashboard
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: AdminDashboard/Info.plist
      configurations:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
