name: AdminDashboard
options:
  bundleIdPrefix: com.doushujun
  deploymentTarget:
    iOS: "16.0"
targets:
  AdminDashboard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AdminDashboard
    info:
      path: AdminDashboard/Info.plist
      properties:
        CFBundleDisplayName: 抖数君后台
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations: [Portrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doushujun.admin
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: 抖数君后台
      configurations:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
