name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Clean and Build
        id: build
        run: |
          echo "=== Cleaning ==="
          rm -rf build
          mkdir -p build
          
          echo "=== Building ==="
          set -o pipefail
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            2>&1 | tee build.log
          
          echo "Build exit code: ${PIPESTATUS[0]}"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Find App
        if: always()
        run: |
          echo "=== Looking for .app ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            du -sh "$app"
            ls -la "$app" | head -10
          done
          
          echo ""
          echo "=== Build Products ==="
          find build/Build/Products -type f 2>/dev/null | head -20

      - name: Package IPA
        id: package
        continue-on-error: true
        run: |
          echo "=== Packaging IPA ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          echo "App path: '$APP'"
          
          if [ -z "$APP" ]; then
            echo "ERROR: No AdminDashboard.app found!"
            echo "Available apps:"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          
          echo "Found app: $APP"
          echo "App size:"
          du -sh "$APP"
          echo "App contents:"
          ls -la "$APP" | head -15
          
          # Check if binary exists
          if [ ! -f "$APP/AdminDashboard" ]; then
            echo "ERROR: Binary not found in .app!"
            exit 1
          fi
          
          # Package IPA
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          
          echo "=== Creating IPA ==="
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          if [ -f AdminDashboard-unsigned.ipa ]; then
            echo "=== IPA created ==="
            ls -lh AdminDashboard-unsigned.ipa
            unzip -l AdminDashboard-unsigned.ipa | head -20
          else
            echo "ERROR: IPA file not created!"
            exit 1
          fi

      - name: Upload IPA
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
