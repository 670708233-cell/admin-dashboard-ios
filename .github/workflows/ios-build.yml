name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          
          # Diagnostic: show build settings
          echo "=== Build settings ==="
          xcodebuild -project AdminDashboard.xcodeproj -scheme AdminDashboard -showBuildSettings 2>&1 | head -50
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== Build FAILED ==="
            echo "=== Full build log ==="
            cat build.log
            echo "=== End of build log ==="
            exit $BUILD_EXIT
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for .app ==="
          find build -name "*.app" -type d 2>/dev/null
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in build/"
            find build -maxdepth 4 -name "*.app" 2>/dev/null | head
            ls -la build/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          echo "=== App contents ==="
          ls -la "$APP"
          echo "=== App size ==="
          du -sh "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
