name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build and Capture Error
        id: build_step
        continue-on-error: true
        run: |
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          
          # Run xcodebuild and capture all output
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          
          # Save exit code as output
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          
          # Show first 100 lines of error
          echo "=== Build Error (first 100 lines) ==="
          head -100 build.log
          
          exit $BUILD_EXIT

      - name: Create Public Issue with Error
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking if build.log exists ==="
          ls -la build.log 2>/dev/null || echo "No build.log found"
          
          if [ -f build.log ]; then
            ERROR_CONTENT=$(head -150 build.log | base64 -w0)
            echo "Build log length: ${#ERROR_CONTENT} chars"
            
            # Decode and create issue
            DECODED=$(echo "$ERROR_CONTENT" | base64 -d)
            
            ISSUE_TITLE="iOS Build Error - Run ${{ github.run_id }}"
            ISSUE_BODY="### Build Log (first 150 lines)\n\n\`\`\`\n$DECODED\n\`\`\`\n\n**Run ID:** ${{ github.run_id }}\n**Commit:** ${{ github.sha }}"
            
            echo "Creating issue: $ISSUE_TITLE"
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --repo ${{ github.repository }} \
              || echo "Failed to create issue, exit code: $?"
          else
            echo "No build.log found, skipping issue creation"
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for .app ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in build/"
            find build -maxdepth 4 -name "*.app" 2>/dev/null | head
            ls -la build/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          echo "=== App contents ==="
          ls -la "$APP"
          echo "=== App size ==="
          du -sh "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
