name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Verify Project
        run: xcodebuild -list -project AdminDashboard.xcodeproj

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Inspect Build
        if: always()
        run: |
          echo "=== BUILD LOG (last 200 lines) ==="
          tail -200 build.log 2>/dev/null || echo "No build.log"
          
          echo ""
          echo "=== APP SEARCH ==="
          find build -name "*.app" -type d 2>/dev/null || echo "No .app found"
          
          echo ""
          echo "=== PRODUCTS DIR ==="
          ls -la build/Build/Products/ 2>/dev/null || echo "No Products dir"

      - name: Create Gist on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating gist ==="
          echo "Build log:"
          cat build.log 2>/dev/null || echo "No log"
          
          # Create gist with build log
          gh gist create build.log \
            --public \
            --filename "build-log-run-${{ github.run_id }}.log" \
            --description "iOS Build Error - Run ${{ github.run_id }}" \
            --url-only || echo "Gist creation failed"

      - name: Package IPA
        if: success()
        run: |
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: No AdminDashboard.app found!"
            exit 1
          fi
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
