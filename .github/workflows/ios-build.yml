name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Verify Project
        run: xcodebuild -list -project AdminDashboard.xcodeproj

      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          echo "Build exit code: ${PIPESTATUS[0]}"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check Build Result
        id: check
        run: |
          if [ "${{ steps.build.outputs.exit_code }}" != "0" ]; then
            echo "BUILD FAILED with exit code ${{ steps.build.outputs.exit_code }}"
            echo "error=true" >> "$GITHUB_OUTPUT"
            
            echo "=== Build log tail ==="
            tail -150 build.log
          else
            echo "BUILD SUCCEEDED"
            echo "error=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Public Gist on Failure
        if: steps.check.outputs.error == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating public gist with build error ==="
          
          # Create a summary file
          cat > gist-summary.md << EOF
          # iOS Build Error
          
          **Run:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ## Error
          
          Build failed with exit code ${{ steps.build.outputs.exit_code }}
          
          ## Build Log (last 200 lines)
          
          \`\`\`
          $(tail -200 build.log)
          \`\`\`
          EOF
          
          # Create gist
          gh gist create gist-summary.md --public \
            --filename "build-error.md" \
            --description "iOS Build Error - Run ${{ github.run_id }}" \
            || echo "Failed to create gist"

      - name: Package IPA
        if: success()
        run: |
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: AdminDashboard.app not found!"
            exit 1
          fi
          
          echo "Packaging: $APP"
          du -sh "$APP"
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
