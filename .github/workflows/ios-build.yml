name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-device-unsigned:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
        run: |
          echo "=== Step 1: xcodegen generate ==="
          xcodegen generate

          echo "=== Step 2: Find available Xcode versions ==="
          ls /Applications/Xcode*.app 2>/dev/null || echo "No Xcode found in /Applications"

          echo "=== Step 3: Build ==="
          # 尝试多个可能的 Xcode 路径
          for xcode in /Applications/Xcode_16.app /Applications/Xcode_15.app /Applications/Xcode.app; do
            if [ -d "$xcode" ]; then
              echo "Using Xcode: $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done

          xcodebuild \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build 2>&1 | tail -80

          echo "=== Build result: $? ==="
          echo "=== Products ==="
          find build/Build/Products -name '*.app' -o -name '*.ipa' 2>/dev/null

      - name: Package unsigned IPA
        run: |
          APP_DIR=$(find build/Build/Products -name '*.app' -type d 2>/dev/null | head -1)
          echo "Found app: $APP_DIR"
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app found!"
            ls -la build/Build/Products/ 2>/dev/null || true
            find build -maxdepth 4 -name '*.app' 2>/dev/null | head -10
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
