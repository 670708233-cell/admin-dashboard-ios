name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Verify Project
        run: xcodebuild -list -project AdminDashboard.xcodeproj

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Find Built Products
        if: always()
        run: |
          echo "=== Build log summary ==="
          grep -E "(error:|BUILD SUCCEEDED|BUILD FAILED|Ld /|CodeSign|CompileSwift)" build.log 2>/dev/null | head -100 || true
          
          echo ""
          echo "=== Searching for .app files ==="
          APP_COUNT=$(find build -name "*.app" -type d 2>/dev/null | wc -l)
          echo "Found $APP_COUNT .app files"
          
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            du -sh "$app" 2>/dev/null
          done
          
          echo ""
          echo "=== Build/Build/Products tree ==="
          find build/Build/Products -maxdepth 5 2>/dev/null | head -30 || true

      - name: Create Issue on Any Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating public issue with build info ==="
          
          # Collect error info
          BUILD_LOG=$(head -150 build.log 2>/dev/null || echo "No build.log")
          APP_SEARCH=$(find build -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app found")
          PRODUCTS=$(ls -la build/Build/Products/ 2>/dev/null || echo "No Products dir")
          
          ISSUE_BODY="## iOS Build Failed
          
          **Run ID:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          
          ### Build Log (first 150 lines)
          \`\`\`
          $BUILD_LOG
          \`\`\`
          
          ### App Search Results
          \`\`\`
          $APP_SEARCH
          \`\`\`
          
          ### Products Directory
          \`\`\`
          $PRODUCTS
          \`\`\`
          
          [View Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          gh issue create \
            --title "iOS Build Failed - Run ${{ github.run_id }}" \
            --body "$ISSUE_BODY" \
            --repo ${{ github.repository }} || echo "Failed to create issue"

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for AdminDashboard.app ==="
          
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: AdminDashboard.app not found!"
            echo "Available .app files:"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          
          echo "=== Found: $APP ==="
          du -sh "$APP"
          ls -la "$APP" | head -15
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          unzip -l AdminDashboard-unsigned.ipa | head -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
