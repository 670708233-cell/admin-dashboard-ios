name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Building ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            2>&1 | tee /tmp/build.log
          echo "Build exit: $?"

      - name: Find app and package IPA
        run: |
          echo "=== Searching for .app ==="
          find build -name "*.app" 2>/dev/null
          echo "=== All directories in build/Build/Products ==="
          find build/Build/Products -maxdepth 3 -type d 2>/dev/null
          echo "=== Attempting alternative package ==="
          # xcodebuild with -archivePath for Archive approach
          xcodebuild archive \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/AdminDashboard.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            2>&1 | tee /tmp/archive.log
          echo "Archive exit: $?"
          echo "=== Archive contents ==="
          ls -la build/AdminDashboard.xcarchive/ 2>/dev/null || true
          ls -la build/AdminDashboard.xcarchive/Products/ 2>/dev/null || true

      - name: Create IPA from archive
        run: |
          ARCHIVE="build/AdminDashboard.xcarchive"
          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Archive not found at $ARCHIVE"
            exit 1
          fi
          APP="$ARCHIVE/Products/Applications/AdminDashboard.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: App not found in archive"
            find "$ARCHIVE" -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
