name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        run: |
          set -e
          echo "=== Xcode version ==="
          xcodebuild -version
          
          echo "=== Building ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-"
          
          echo "=== Build completed ==="
          
          # Find the .app
          APP=""
          if [ -d "build/Build/Products/Debug-iphoneos" ]; then
            APP="build/Build/Products/Debug-iphoneos/AdminDashboard.app"
            if [ ! -d "$APP" ]; then
              APP=$(ls build/Build/Products/Debug-iphoneos/*.app 2>/dev/null | head -1)
            fi
          fi
          
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "Trying fallback search..."
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          echo "Found app: $APP"
          
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: No .app found!"
            echo "=== Directory listing ==="
            ls -laR build/Build/Products/ 2>/dev/null || true
            find build -name "*.app" 2>/dev/null || true
            exit 1
          fi
          
          # Package IPA
          echo "=== Packaging IPA ==="
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          unzip -l AdminDashboard-unsigned.ipa | head -10

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
