name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Clean Build
        run: |
          echo "=== Cleaning derived data ==="
          rm -rf build
          mkdir -p build

      - name: Build with Archive
        id: build_step
        continue-on-error: true
        run: |
          echo "=== Building with xcodebuild (archive method) ==="
          set -o pipefail
          
          # Use archive instead of build for more reliable output
          xcodebuild archive \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit $BUILD_EXIT

      - name: Inspect Archive Output
        if: always()
        run: |
          echo "=== Build log summary ==="
          grep -E "(error:|warning:|BUILD SUCCEEDED|BUILD FAILED|Archive succeeded)" build.log 2>/dev/null | head -50 || true
          
          echo ""
          echo "=== Looking for .app in DerivedData ==="
          find build -name "*.app" -type d 2>/dev/null | head -10
          
          echo ""
          echo "=== DerivedData structure ==="
          ls -la build/ 2>/dev/null || echo "No build dir"
          find build -name "*.xcarchive" -type d 2>/dev/null | head -5
          
          echo ""
          echo "=== xcarchive contents ==="
          find build -name "*.xcarchive" -type d 2>/dev/null | while read archive; do
            echo "Found: $archive"
            ls -la "$archive" 2>/dev/null
            ls -la "$archive/Products" 2>/dev/null
            ls -la "$archive/Products/Applications" 2>/dev/null
          done

      - name: Package IPA from Archive
        if: success()
        run: |
          echo "=== Finding .app from archive ==="
          
          # Try to find .app in archive
          APP=$(find build -name "*.xcarchive" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            APP="$APP/Products/Applications/AdminDashboard.app"
            echo "Found archive app: $APP"
          else
            APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
            echo "Found regular app: $APP"
          fi
          
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: AdminDashboard.app not found!"
            exit 1
          fi
          
          echo "=== App details ==="
          du -sh "$APP"
          file "$APP/AdminDashboard" 2>/dev/null
          
          # Package IPA
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          unzip -l AdminDashboard-unsigned.ipa | head -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
