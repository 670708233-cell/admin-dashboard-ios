name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-device-unsigned:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & Archive (unsigned)
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
        run: |
          # 列出可用 Xcode
          echo "=== Available Xcodes ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "none found"

          # 选一个可用的 Xcode
          for xc in /Applications/Xcode_16.app /Applications/Xcode_15.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              echo "Using: $xc"
              sudo xcode-select -s "$xc/Contents/Developer"
              xcodebuild -version
              break
            fi
          done

          echo "=== Starting build ==="
          xcodebuild \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build 2>&1 | tail -100

          echo "=== Exit code: ${PIPESTATUS[0]} ==="
          echo "=== App files ==="
          find build/Build/Products -name '*.app' -type d 2>/dev/null
          find build/Build/Products -name '*.ipa' -type f 2>/dev/null

      - name: Package IPA
        run: |
          APP_DIR=$(find build/Build/Products -name '*.app' -type d 2>/dev/null | head -1)
          echo "App dir: $APP_DIR"
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app found!"
            ls -laR build/Build/Products/ | head -60
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
