name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit $BUILD_EXIT

      - name: Create Public Gist with Build Log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating public gist with build log ==="
          
          # Check if build.log exists
          if [ ! -f build.log ]; then
            echo "No build.log found"
            # Create empty file with timestamp
            echo "Build log not found at $(date)" > build.log
          fi
          
          # Create gist
          GIST_URL=$(gh gist create build.log --public \
            --filename "build-log-run-${{ github.run_id }}.log" \
            --description "iOS Build Error Log for Run ${{ github.run_id }}" \
            2>&1) || true
          
          echo "Gist creation result: $GIST_URL"
          
          # Extract gist URL from output
          if echo "$GIST_URL" | grep -q "https://gist.github.com"; then
            GIST_ID=$(echo "$GIST_URL" | grep -oE '[a-f0-9]{20,}' | head -1)
            echo "GIST_URL=https://gist.github.com/$GIST_ID" >> "$GITHUB_ENV"
            echo "Public build log: https://gist.github.com/$GIST_ID"
          else
            echo "Failed to create gist"
            echo "Raw output: $GIST_URL"
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for .app ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in build/"
            find build -maxdepth 4 -name "*.app" 2>/dev/null | head
            ls -la build/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          echo "=== App contents ==="
          ls -la "$APP"
          echo "=== App size ==="
          du -sh "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
