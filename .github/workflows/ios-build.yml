name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Verify Project
        run: xcodebuild -list -project AdminDashboard.xcodeproj

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Check Build Status
        if: always()
        run: |
          echo "Build exit code: ${{ steps.build.outputs.exit_code }}"
          
          if [ "${{ steps.build.outputs.exit_code }}" != "0" ]; then
            echo "BUILD FAILED"
            echo "error=true" >> "$GITHUB_ENV"
            
            # Show error
            echo "=== Build log tail ==="
            tail -100 build.log
          else
            echo "BUILD SUCCEEDED"
            echo "error=false" >> "$GITHUB_ENV"
          fi

      - name: Create Issue on Failure
        if: env.error == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating public issue ==="
          
          LOG_PART=$(head -100 build.log | head -c 4000)
          
          gh issue create \
            --title "iOS Build Failed - Run ${{ github.run_id }}" \
            --body "## Build Error
          
          **Run ID:** ${{ github.run_id }}
          **Exit Code:** ${{ steps.build.outputs.exit_code }}
          
          ### Build Log
          \`\`\`
          $LOG_PART
          \`\`\`" \
            --repo ${{ github.repository }} || echo "Failed to create issue"

      - name: Package IPA
        if: success()
        run: |
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
