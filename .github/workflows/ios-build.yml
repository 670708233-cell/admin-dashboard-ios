name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Clean and Build
        id: build
        continue-on-error: true
        run: |
          echo "=== Cleaning ==="
          rm -rf build
          mkdir -p build
          
          echo "=== Building ==="
          set -o pipefail
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            2>&1 | tee build.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Find App
        if: always()
        run: |
          echo "=== Looking for .app ==="
          APP_COUNT=$(find build -name "*.app" -type d 2>/dev/null | wc -l)
          echo "Found $APP_COUNT .app files"
          
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            du -sh "$app"
            ls -la "$app" | head -10
          done
          
          echo ""
          echo "=== Build Products ==="
          find build/Build/Products -type f 2>/dev/null | head -20
          
          echo ""
          echo "=== Build Log Summary ==="
          grep -E "(BUILD SUCCEEDED|BUILD FAILED|error:)" build.log 2>/dev/null | head -20 || true

      - name: Package IPA
        id: package
        continue-on-error: true
        run: |
          echo "=== Packaging IPA ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: No AdminDashboard.app found!"
            exit 1
          fi
          
          echo "Found: $APP"
          du -sh "$APP"
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          unzip -l AdminDashboard-unsigned.ipa | head -20
          
          echo "success=true" >> "$GITHUB_OUTPUT"

      - name: Create Gist on Failure
        if: steps.package.outcome == 'failure' || steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating gist with error ==="
          
          # Collect error info
          BUILD_LOG=$(tail -200 build.log 2>/dev/null || echo "No build.log")
          APP_SEARCH=$(find build -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app found")
          PRODUCTS=$(ls -la build/Build/Products/ 2>/dev/null || echo "No Products dir")
          
          # Create summary
          cat > /tmp/error-summary.md << EOF
          # iOS Build Error
          
          **Run:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          
          ## Build Log (last 200 lines)
          
          \`\`\`
          $BUILD_LOG
          \`\`\`
          
          ## App Search Results
          
          \`\`\`
          $APP_SEARCH
          \`\`\`
          
          ## Products Directory
          
          \`\`\`
          $PRODUCTS
          \`\`\`
          EOF
          
          # Upload to gist
          gh gist create /tmp/error-summary.md --public \
            --filename "build-error.md" \
            --description "iOS Build Error - Run ${{ github.run_id }}" \
            --url-only || echo "Failed to create gist"

      - name: Upload IPA
        if: steps.package.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
