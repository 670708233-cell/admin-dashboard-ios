name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Clean Derived Data
        run: |
          echo "=== Cleaning DerivedData ==="
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf build
          mkdir -p build

      - name: Build with Verbose Output
        id: build
        continue-on-error: true
        run: |
          echo "=== Starting build ==="
          set -o pipefail
          
          # Use xcodebuild with build-for-testing to force compilation
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          
          # Show compilation summary
          echo ""
          echo "=== Compilation Summary ==="
          grep -c "CompileSwift" build.log 2>/dev/null || echo "0"
          grep "BUILD SUCCEEDED\|BUILD FAILED" build.log 2>/dev/null || echo "No summary found"

      - name: Inspect Results
        if: always()
        run: |
          echo "=== Build Exit Code: ${{ steps.build.outputs.exit_code }} ==="
          
          echo ""
          echo "=== Build Log (last 100 lines) ==="
          tail -100 build.log 2>/dev/null || echo "No build.log"
          
          echo ""
          echo "=== Searching for .app ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            du -sh "$app"
            ls -la "$app" | head -10
          done
          
          echo ""
          echo "=== DerivedData structure ==="
          find build -maxdepth 5 -type d 2>/dev/null | head -30

      - name: Create Gist with Error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating gist with build error ==="
          gh gist create build.log \
            --public \
            --filename "build-error.log" \
            --description "iOS Build Error - Run ${{ github.run_id }}" \
            --url-only || echo "Failed to create gist"

      - name: Package IPA
        if: success()
        run: |
          echo "=== Packaging IPA ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: No AdminDashboard.app found!"
            exit 1
          fi
          
          echo "Found: $APP"
          du -sh "$APP"
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
