name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: |
          xcodebuild -version
          ls /Applications/Xcode*.app 2>/dev/null || true

      - name: Build unsigned IPA
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: ""
        run: |
          set -e
          echo "=== Starting build ==="
          
          # Clean first
          rm -rf build
          
          # Build with explicit settings
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/build.log
          
          echo "=== Build exit: $? ==="
          
          # Find the .app
          APP=$(find build/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found!"
            ls -la build/Build/Products/ 2>/dev/null || true
            cat /tmp/build.log | tail -50
            exit 1
          fi
          echo "Found app: $APP"
          
          # Package IPA
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 14
