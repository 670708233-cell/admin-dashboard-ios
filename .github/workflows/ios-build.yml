name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit $BUILD_EXIT

      - name: Find Built App
        if: always()
        run: |
          echo "=== Searching for .app in build directory ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            echo "Size: $(du -sh "$app" | cut -f1)"
            echo "Contents:"
            ls -la "$app" | head -20
          done
          
          echo "=== Build directory structure ==="
          ls -la build/ 2>/dev/null || echo "No build directory"
          ls -la build/Build/ 2>/dev/null || echo "No build/Build directory"
          ls -la build/Build/Products/ 2>/dev/null || echo "No build/Build/Products directory"
          ls -la build/Build/Products/Release-iphoneos/ 2>/dev/null || echo "No Release-iphoneos directory"

      - name: Create Public Debug File
        if: always()
        run: |
          echo "=== Creating public debug file ==="
          
          # Create a markdown file with build info
          cat > BUILD_DEBUG.md << 'EOF'
          # iOS Build Debug Info
          
          ## Run Information
          - Run ID: ${{ github.run_id }}
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Timestamp: ${{ github.event.head_commit.timestamp }}
          
          EOF
          
          # Append build log (first 500 lines)
          if [ -f build.log ]; then
            echo "## Build Log (first 500 lines)" >> BUILD_DEBUG.md
            echo '```' >> BUILD_DEBUG.md
            head -500 build.log >> BUILD_DEBUG.md
            echo '```' >> BUILD_DEBUG.md
          else
            echo "No build.log found" >> BUILD_DEBUG.md
          fi
          
          # Append app search results
          echo "" >> BUILD_DEBUG.md
          echo "## App Search Results" >> BUILD_DEBUG.md
          find build -name "*.app" -type d 2>/dev/null | head -20 >> BUILD_DEBUG.md || echo "No .app found" >> BUILD_DEBUG.md
          
          echo "Created BUILD_DEBUG.md"
          cat BUILD_DEBUG.md

      - name: Commit Debug Info to Public Branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Committing debug info to debug-logs branch ==="
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git checkout --orphan debug-logs 2>/dev/null || git checkout -b debug-logs
          git rm -rf . 2>/dev/null || true
          git add BUILD_DEBUG.md
          git commit -m "debug: build info for run ${{ github.run_id }}" || true
          git push origin debug-logs --force || echo "Failed to push to debug-logs"

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for AdminDashboard.app ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: AdminDashboard.app not found!"
            echo "Searching for any .app:"
            find build -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "=== Found app: $APP ==="
          echo "App size:"
          du -sh "$APP"
          echo "App contents (first 30):"
          ls -la "$APP" | head -30
          
          # Package IPA
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
