name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build
        run: |
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          exit $BUILD_EXIT

      - name: Surface build error via GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating public issue with build log ==="
          ISSUE_TITLE="iOS Build Error - Run ${{ github.run_id }}"
          ISSUE_BODY="Build log for run ${{ github.run_id }}:\n\n\`\`\`\n$(head -200 build.log)\n\`\`\`\n\nFull log: [build.log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --repo ${{ github.repository }} || echo "Failed to create issue"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for .app ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in build/"
            find build -maxdepth 4 -name "*.app" 2>/dev/null | head
            ls -la build/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          echo "=== App contents ==="
          ls -la "$APP"
          echo "=== App size ==="
          du -sh "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
