name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        run: |
          set -e
          echo "=== Xcode version ==="
          xcodebuild -version
          
          echo "=== Building ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            2>&1 | tee /tmp/build.log
          
          echo "=== Build completed ==="
          
          # Find the .app - check multiple possible locations
          APP=""
          for pattern in \
            "build/Build/Products/Debug-iphoneos/*.app" \
            "build/Build/Products/*.app" \
            "build/Build/Products/Debug-iphoneos/**/*.app"; do
            matches=$(ls $pattern 2>/dev/null || true)
            if [ -n "$matches" ]; then
              APP=$(echo "$matches" | head -1)
              echo "Found at: $APP"
              break
            fi
          done
          
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found! Searching..."
            find build -name "*.app" 2>/dev/null || true
            ls -la build/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          
          echo "=== Packaging IPA: $APP ==="
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # Also copy _CodeSignature if present
          SIG_DIR="$(dirname "$APP")/_CodeSignature"
          if [ -d "$SIG_DIR" ]; then
            cp -R "$SIG_DIR" Payload/
          fi
          # Create empty embedded.mobileprovision for unsigned
          echo '<key>Provisions</key><array></array>' > Payload/embedded.mobileprovision
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== SUCCESS ==="
          ls -lh AdminDashboard-unsigned.ipa
          unzip -l AdminDashboard-unsigned.ipa | head -15

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
