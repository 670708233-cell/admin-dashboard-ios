name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit $BUILD_EXIT

      - name: Inspect Build
        if: always()
        run: |
          echo "=== Build log tail ==="
          tail -100 build.log 2>/dev/null || echo "No build.log"
          
          echo ""
          echo "=== Looking for .app ==="
          find build -name "*.app" -type d 2>/dev/null | head -10
          
          echo ""
          echo "=== Build Products ==="
          ls -la build/Build/Products/ 2>/dev/null || echo "No Products dir"

      - name: Create Public Gist on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating public gist with build error ==="
          
          # Create gist with build log
          gh gist create build.log \
            --public \
            --filename "build-error-run-${{ github.run_id }}.log" \
            --description "iOS Build Error - Run ${{ github.run_id }}" \
            || echo "Failed to create gist"
          
          # Also create a summary file
          cat > gist-summary.md << EOF
          # iOS Build Error Summary
          
          **Run ID:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ## Error Details
          
          Build failed. See the attached log file for details.
          
          ## Build Log (first 200 lines)
          
          \`\`\`
          $(head -200 build.log 2>/dev/null || echo "No build.log")
          \`\`\`
          
          ## App Search Results
          
          \`\`\`
          $(find build -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app found")
          \`\`\`
          EOF
          
          gh gist edit ${{ github.run_id }} gist-summary.md --public 2>/dev/null || true

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for AdminDashboard.app ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: AdminDashboard.app not found!"
            find build -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "=== Found: $APP ==="
          du -sh "$APP"
          file "$APP/AdminDashboard" 2>/dev/null
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          unzip -l AdminDashboard-unsigned.ipa | head -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
