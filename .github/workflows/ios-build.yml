name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Verify Project
        run: xcodebuild -list -project AdminDashboard.xcodeproj

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Find Built Products
        if: always()
        run: |
          echo "=== Build log summary ==="
          grep -E "(error:|BUILD SUCCEEDED|BUILD FAILED|Ld /|CodeSign)" build.log 2>/dev/null | head -50 || true
          
          echo ""
          echo "=== Searching for .app files ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            echo "Size: $(du -sh "$app" 2>/dev/null | cut -f1)"
            echo "Contents:"
            ls -la "$app" 2>/dev/null | head -15
            echo ""
          done
          
          echo "=== Build/Build/Products structure ==="
          find build/Build/Products -type f -o -type d 2>/dev/null | head -50 || true
          
          echo "=== DerivedData root ==="
          ls -la build/ 2>/dev/null || echo "No build directory"

      - name: Create Issue on Failure
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG_PART=$(head -100 build.log | head -c 4000)
          gh issue create \
            --title "iOS Build Failed - Run ${{ github.run_id }}" \
            --body "## Build Error
          
          **Exit Code:** ${{ steps.build.outputs.exit_code }}
          
          ### Build Log
          \`\`\`
          $LOG_PART
          \`\`\`" \
            --repo ${{ github.repository }} || true

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for AdminDashboard.app ==="
          
          # Try multiple possible locations
          APP=""
          
          # Location 1: Direct search
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          # Location 2: In Release-iphoneos
          if [ -z "$APP" ]; then
            APP=$(find build -path "*/Release-iphoneos/*.app" -type d 2>/dev/null | head -1)
          fi
          
          # Location 3: Any .app
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP" ]; then
            echo "ERROR: No .app file found in build directory!"
            echo "Build directory contents:"
            ls -R build/Build/Products/ 2>/dev/null || echo "No Products directory"
            exit 1
          fi
          
          echo "=== Found app: $APP ==="
          echo "Size:"
          du -sh "$APP"
          
          # Check binary
          if [ -f "$APP/AdminDashboard" ]; then
            echo "Binary exists:"
            file "$APP/AdminDashboard"
            ls -lh "$APP/AdminDashboard"
          else
            echo "WARNING: No binary in .app"
            ls -la "$APP"
          fi
          
          # Package IPA
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          unzip -l AdminDashboard-unsigned.ipa | head -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
