name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build with Detailed Output
        id: build_step
        continue-on-error: true
        run: |
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          
          # Use xcodebuild with verbose logging
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            VERBOSE_XCODE_BUILD=1 \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          
          # Show last 100 lines of log
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log
          
          exit $BUILD_EXIT

      - name: Inspect Build Output
        if: always()
        run: |
          echo "=== Build directory structure ==="
          find build -type f -name "*.app" -o -name "*.ipa" -o -name "*.xcarchive" 2>/dev/null | head -20
          
          echo ""
          echo "=== Build/Build/Products directory ==="
          ls -la build/Build/Products/ 2>/dev/null || echo "No Products directory"
          
          echo ""
          echo "=== Release-iphoneos contents ==="
          ls -la build/Build/Products/Release-iphoneos/ 2>/dev/null || echo "No Release-iphoneos directory"
          
          echo ""
          echo "=== Looking for .app bundles ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            echo "Size: $(du -sh "$app" 2>/dev/null | cut -f1)"
            echo "Contents:"
            ls -la "$app" 2>/dev/null | head -20
            echo ""
          done
          
          echo "=== Build log summary ==="
          grep -E "(error:|warning:|BUILD SUCCEEDED|BUILD FAILED)" build.log 2>/dev/null | head -30 || true

      - name: Create Public Debug File
        if: always()
        run: |
          cat > BUILD_DEBUG.md << 'EOF'
          # iOS Build Debug Information
          
          ## Run Details
          - Run ID: RUN_ID_PLACEHOLDER
          - Commit: COMMIT_SHA_PLACEHOLDER
          - Branch: BRANCH_NAME_PLACEHOLDER
          - Timestamp: TIMESTAMP_PLACEHOLDER
          
          ## Build Log
          ```
          $(head -500 build.log 2>/dev/null || echo "No build.log")
          ```
          
          ## App Search Results
          ```
          $(find build -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app found")
          ```
          
          ## Build Directory
          ```
          $(ls -la build/Build/Products/ 2>/dev/null || echo "No Products directory")
          ```
          EOF
          
          sed -i "s/RUN_ID_PLACEHOLDER/${{ github.run_id }}/g" BUILD_DEBUG.md
          sed -i "s/COMMIT_SHA_PLACEHOLDER/${{ github.sha }}/g" BUILD_DEBUG.md
          sed -i "s/BRANCH_NAME_PLACEHOLDER/${{ github.ref_name }}/g" BUILD_DEBUG.md
          sed -i "s/TIMESTAMP_PLACEHOLDER/${{ github.event.head_commit.timestamp }}/g" BUILD_DEBUG.md
          
          cat BUILD_DEBUG.md

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for AdminDashboard.app ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: AdminDashboard.app not found!"
            echo "All .app files found:"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          
          echo "=== Found app: $APP ==="
          echo "App size:"
          du -sh "$APP"
          echo "Binary info:"
          file "$APP/AdminDashboard" 2>/dev/null || echo "No binary"
          
          # Package IPA
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')"
          
          # Verify IPA contents
          echo "=== IPA contents ==="
          unzip -l AdminDashboard-unsigned.ipa | head -20

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
