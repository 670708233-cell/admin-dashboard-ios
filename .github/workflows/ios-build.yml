name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: ""
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Building ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/build.log
          echo "Exit: $?"

      - name: Find and Package IPA
        run: |
          echo "=== Looking for .app ==="
          find build -name "*.app" -type d 2>/dev/null
          echo "=== Products directory ==="
          ls -la build/Build/Products/ 2>/dev/null || true
          ls -la build/Build/Products/Debug-iphoneos/ 2>/dev/null || true
          echo "=== Packaging ==="
          APP=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in build/"
            exit 1
          fi
          echo "Found: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
