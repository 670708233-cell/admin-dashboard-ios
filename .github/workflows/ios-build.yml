name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls /Applications/ | grep -i xcode || echo "NO XCODE FOUND"
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcodebuild -version

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build
        id: build_step
        continue-on-error: true
        run: |
          echo "=== Building with xcodebuild ==="
          set -o pipefail
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit $BUILD_EXIT

      - name: Find Built App
        if: always()
        run: |
          echo "=== Searching for .app in build directory ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            echo "Size: $(du -sh "$app" | cut -f1)"
            echo "Contents:"
            ls -la "$app" | head -20
          done
          
          echo "=== Build directory structure ==="
          ls -la build/ 2>/dev/null || echo "No build directory"
          ls -la build/Build/ 2>/dev/null || echo "No build/Build directory"
          ls -la build/Build/Products/ 2>/dev/null || echo "No build/Build/Products directory"
          ls -la build/Build/Products/Release-iphoneos/ 2>/dev/null || echo "No Release-iphoneos directory"

      - name: Update README with Build Info
        if: always()
        run: |
          echo "=== Updating README with build info ==="
          
          # Create build info section
          BUILD_INFO="<!-- BEGIN_BUILD_INFO -->
          
          ## Build Status
          - **Run ID**: ${{ github.run_id }}
          - **Commit**: \`${{ github.sha }}\`
          - **Branch**: \`${{ github.ref_name }}\`
          - **Timestamp**: ${{ github.event.head_commit.timestamp }}
          - **Exit Code**: ${{ steps.build_step.outputs.exit_code }}
          
          "
          
          # Append build log if exists
          if [ -f build.log ]; then
            BUILD_INFO+="### Build Log (first 300 lines)
          
          \`\`\`
          $(head -300 build.log)
          \`\`\`
          
          "
          else
            BUILD_INFO+="No build.log found
          
          "
          fi
          
          # Append app search results
          BUILD_INFO+="### App Search Results
          
          \`\`\`
          $(find build -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app found")
          \`\`\`
          
          <!-- END_BUILD_INFO -->"
          
          # Write to README
          echo "$BUILD_INFO" > BUILD_DEBUG.md
          cat BUILD_DEBUG.md
          
          # Update README.md (prepend build info)
          if [ -f README.md ]; then
            cat README.md > README_BACKUP.md
          else
            echo "# Admin Dashboard iOS" > README_BACKUP.md
          fi
          
          cat BUILD_DEBUG.md README_BACKUP.md > README.md
          echo "Updated README.md"
          ls -la README.md

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for AdminDashboard.app ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: AdminDashboard.app not found!"
            echo "Searching for any .app:"
            find build -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "=== Found app: $APP ==="
          echo "App size:"
          du -sh "$APP"
          echo "App contents (first 30):"
          ls -la "$APP" | head -30
          
          # Package IPA
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
