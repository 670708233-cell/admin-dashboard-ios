name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Building ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            2>&1 | tee /tmp/build.log
          echo "Build exit: ${PIPESTATUS[0]}"

      - name: Package IPA
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        run: |
          echo "=== Finding .app ==="
          # Try multiple locations
          APP=""
          for dir in build/Build/Products/Debug-iphoneos build/Build/Products; do
            if [ -d "$dir" ]; then
              found=$(ls "$dir"/*.app 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                APP="$found"
                break
              fi
            fi
          done
          
          # Fallback: recursive find
          if [ -z "$APP" ]; then
            APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          echo "App path: $APP"
          
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found"
            echo "=== Contents of build/Build/Products ==="
            ls -laR build/Build/Products/ 2>/dev/null || true
            echo "=== All .app files ==="
            find build -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "=== Packaging IPA ==="
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa
          echo "=== IPA ready ==="

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
