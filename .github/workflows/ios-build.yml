name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Build
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          
          echo "=== Project structure ==="
          ls -la AdminDashboard.xcodeproj/
          
          echo "=== Building with xcodebuild ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== Build FAILED ==="
            echo "Full build log saved to build.log"
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        if: success()
        run: |
          echo "=== Looking for .app ===" >> $GITHUB_STEP_SUMMARY
          find build -name "*.app" -type d 2>/dev/null
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          echo "Found app: $APP"
          echo "Found app: $APP" >> $GITHUB_STEP_SUMMARY
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in build/"
            echo "ERROR: No .app found in build/" >> $GITHUB_STEP_SUMMARY
            find build -maxdepth 3 -name "*.app" 2>/dev/null | head
            ls -la build/Build/Products/Release-iphoneos/ 2>/dev/null || true
            exit 1
          fi
          echo "=== App contents ==="
          ls -la "$APP"
          echo "=== App size ==="
          du -sh "$APP"
          echo "App size: $(du -sh $APP | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "=== Executable check ==="
          ls -la "$APP/" | head -20
          EXEC=$(find "$APP" -type f -perm +111 2>/dev/null | head -1)
          echo "Executable: $EXEC"
          if [ -z "$EXEC" ]; then
            echo "ERROR: No executable in app bundle" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa
          echo "IPA size: $(ls -lh AdminDashboard-unsigned.ipa | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
