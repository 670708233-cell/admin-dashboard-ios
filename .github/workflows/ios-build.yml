name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Clean and Build
        id: build
        continue-on-error: true
        run: |
          echo "=== Cleaning ==="
          rm -rf build
          mkdir -p build
          
          echo "=== Building ==="
          set -o pipefail
          
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Find App
        if: always()
        run: |
          echo "=== Looking for .app ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            du -sh "$app"
          done

      - name: Create Gist on Failure
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating gist ==="
          echo "Build exit code: ${{ steps.build.outputs.exit_code }}"
          
          # Create gist and capture URL
          GIST_OUTPUT=$(gh gist create build.log --public \
            --filename "build-error.log" \
            --description "iOS Build Error - Run ${{ github.run_id }}" \
            2>&1)
          
          echo "Gist output: $GIST_OUTPUT"
          echo "$GIST_OUTPUT" > /tmp/gist-result.txt
          
          # Save Gist URL for later
          GIST_URL=$(echo "$GIST_OUTPUT" | grep -oE 'https://gist.github.com/[a-f0-9]+' | head -1)
          if [ -n "$GIST_URL" ]; then
            echo "Gist URL: $GIST_URL"
            echo "$GIST_URL" > /tmp/gist-url.txt
          else
            echo "Failed to create gist"
            echo "Raw output: $GIST_OUTPUT" > /tmp/gist-error.txt
          fi

      - name: Upload Gist Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gist-info
          path: /tmp/gist-*.txt

      - name: Package IPA
        if: success()
        run: |
          echo "=== Packaging IPA ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: No AdminDashboard.app found!"
            exit 1
          fi
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
