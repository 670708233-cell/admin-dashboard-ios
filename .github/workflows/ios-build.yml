name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Building ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-"
          echo "Build exit: $?"

      - name: Package IPA
        if: success()
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_IDENTITY: "-"
        run: |
          echo "=== Finding .app ==="
          # xcodebuild with -derivedDataPath build puts .app in a specific location
          # Try multiple patterns
          APPS=()
          for pattern in \
            "build/Build/Products/Debug-iphoneos/AdminDashboard.app" \
            "build/Build/Products/Debug-iphoneos/*.app" \
            "build/Build/Products/*.app"; do
            matches=$(eval ls "$pattern" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              APPS+=($matches)
            fi
          done
          # Also search recursively
          while IFS= read -r -d '' f; do
            APPS+=("$f")
          done < <(find build -name "*.app" -type d -print0 2>/dev/null)
          
          if [ ${#APPS[@]} -eq 0 ]; then
            echo "ERROR: No .app found"
            echo "=== Directory structure ==="
            find build -maxdepth 6 -type d 2>/dev/null | head -30
            exit 1
          fi
          
          APP="${APPS[0]}"
          echo "Found app: $APP"
          
          echo "=== Packaging IPA ==="
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
