name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-device-unsigned:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macOS-14 默认 Xcode 通常是 Xcode 15.x，无需手动指定
      # 若构建失败可尝试改为 /Applications/Xcode_15.app 或 /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          echo "=== XcodeGen done, building ==="
          xcodebuild \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build 2>&1 | tail -50
          echo "=== Build exit code: $? ==="
          # 列出产物目录
          echo "--- Build products ---"
          find build/Build/Products -name '*.app' -type d 2>/dev/null
          find build/Build/Products -name '*.ipa' -type f 2>/dev/null

      - name: Package unsigned IPA
        run: |
          APP_DIR=$(find build/Build/Products -name '*.app' -type d 2>/dev/null | head -1)
          echo "Found app: $APP_DIR"
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app found!"
            ls -la build/Build/Products/ 2>/dev/null || true
            find build -name '*.app' 2>/dev/null | head -5
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          echo "IPA created: $(ls -lh AdminDashboard-unsigned.ipa)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
