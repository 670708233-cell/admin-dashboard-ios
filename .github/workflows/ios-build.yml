name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          DEVELOPMENT_TEAM: ""
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          xcodebuild -showsdks
          
          echo "=== Project list ==="
          xcodebuild -list -project AdminDashboard.xcodeproj || true
          
          echo "=== Building ==="
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== Build FAILED ==="
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit $BUILD_EXIT
          fi
          echo "=== Build SUCCEEDED ==="

      - name: Package IPA
        if: success()
        run: |
          echo "=== Finding .app ==="
          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "Found: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found"
            find build -name "*.app" 2>/dev/null | head -5
            ls -la build/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          echo "=== Packaging IPA ==="
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7
