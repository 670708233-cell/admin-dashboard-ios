name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Clean and Build
        id: build
        continue-on-error: true
        run: |
          echo "=== Cleaning ==="
          rm -rf build
          mkdir -p build
          
          echo "=== Building ==="
          set -o pipefail
          
          # Use sdk directly instead of destination for build command
          xcodebuild build \
            -project AdminDashboard.xcodeproj \
            -scheme AdminDashboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            2>&1 | tee build.log
          
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          
          echo ""
          echo "=== Build Summary ==="
          grep -E "(BUILD SUCCEEDED|BUILD FAILED|error:|CompileSwift)" build.log | head -30

      - name: Find App
        if: always()
        run: |
          echo "=== Looking for .app ==="
          find build -name "*.app" -type d 2>/dev/null | while read app; do
            echo "Found: $app"
            du -sh "$app"
            ls -la "$app" | head -10
          done
          
          echo ""
          echo "=== Build Products ==="
          find build/Build/Products -type f 2>/dev/null | head -20

      - name: Create Gist on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Creating gist ==="
          cat build.log > /tmp/build.log
          gh gist create /tmp/build.log \
            --public \
            --filename "build-error.log" \
            --description "iOS Build Error - Run ${{ github.run_id }}" \
            --url-only || echo "Gist creation failed"

      - name: Package IPA
        if: success()
        run: |
          echo "=== Packaging IPA ==="
          APP=$(find build -name "AdminDashboard.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            echo "ERROR: No AdminDashboard.app found!"
            echo "Build directory:"
            ls -la build/Build/Products/ 2>/dev/null || echo "No Products dir"
            exit 1
          fi
          
          echo "Found: $APP"
          du -sh "$APP"
          
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AdminDashboard-unsigned.ipa Payload/
          rm -rf Payload
          
          echo "=== IPA created ==="
          ls -lh AdminDashboard-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdminDashboard-unsigned
          path: AdminDashboard-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
