name: Test Minimal iOS Build

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Create minimal project
        run: |
          mkdir -p TestApp
          cat > TestApp/TestApp.swift <<'EOF'
          import SwiftUI

          @main
          struct TestApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct ContentView: View {
              var body: some View {
                  Text("Hello, World!")
                      .padding()
              }
          }
          EOF

          cat > Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>TestApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.test.app</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Generate project with xcodegen
        run: |
          brew install xcodegen || true
          cat > project.yml <<'EOF'
          name: TestApp
          options:
            bundleIdPrefix: com.test
          targets:
            TestApp:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: TestApp
              info:
                path: Info.plist
          EOF
          xcodegen generate || echo "XCODEGEN FAILED"

      - name: Build minimal with xcodebuild
        run: |
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          
          if [ -f "TestApp.xcodeproj" ]; then
            echo "=== Building with xcodegen project ==="
            xcodebuild build \
              -project TestApp.xcodeproj \
              -scheme TestApp \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              2>&1 | head -50
          else
            echo "No xcodeproj generated"
          fi
